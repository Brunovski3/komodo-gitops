http:
  routers:
    grafana:
      rule: "Host(`grafana.example.local`)"
      entrypoints: [websecure]
      service: grafana
      tls: {}

    prometheus:
      rule: "Host(`prometheus.example.local`)"
      entrypoints: [websecure]
      service: prometheus
      middlewares: [prometheus-auth]
      tls: {}

  services:
    grafana:
      loadBalancer:
        servers:
          - url: "http://<OBS_IP>:3000"

    prometheus:
      loadBalancer:
        servers:
          - url: "http://<OBS_IP>:9090"

  middlewares:
    prometheus-auth:
      basicAuth:
        users:
          - "admin:$apr1$xxxxxxxx$yyyyyyyyyyyyyyyyyyyyyy"
