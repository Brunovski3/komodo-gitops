modules:
  http_interno:
    prober: http
    timeout: 10s
    http:
      method: GET
      preferred_ip_protocol: ip4
      follow_redirects: false
      enable_http2: false
      valid_status_codes: [200, 201, 204, 301, 302, 303, 307, 308, 400, 401, 403, 404, 405]
      tls_config:
        ca_file: /etc/blackbox/rootCA.crt
