# O próprio sync que carrega os recursos — com Managed Mode.
#
# git <-> komodo em duas direções:
#   • Git -> Komodo : Core polla este repo; push gera diff no IDP
#   • Komodo -> Git : com managed = true (e sync de arquivo único), qualquer
#     update feito na UI do Komodo volta como commit NESTE arquivo
#
# Requisito do bidirecional: o Core precisa de credenciais de git com WRITE
# (PAT) configurada como git account/provider no Komodo — repo privado não
# clona nem pusha sem isso.
#
# Ref: https://github.com/moghtech/komodo/blob/main/docsite/docs/automate/sync-resources.md

[[resource_sync]]
name = "homelab-resources"
description = "Sincroniza recursos declarados neste repo com a instância Komodo (bidirecional, managed)"
managed = true
[resource_sync.config]
git_provider = "github.com"
repo = "Brunovski3/devops-homelab"
branch = "main"
resource_path = [
  "komodo/resources/lab.toml",
]
