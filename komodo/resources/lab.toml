# Recursos gerenciados via Komodo Resource Sync
#
# Este arquivo declara o servidor (via Periphery). O endereço real fica em
# TODO — ajuste antes de importar. Em produção use o mesmo nome de servidor
# que já existe no seu Komodo, para o sync não criar duplicado.
#
# Referência: https://docs.rs/komodo_client/latest/komodo_client/entities/server/struct.ServerConfig.html

[[server]]
name = "lab-prod-01" # TODO: nome do servidor como registrado no Komodo
description = "Bare metal prod - n8n, GLPI, Grafana, Komodo"
tags = ["prod", "lab"]
[server.config]
address = "http://TODO:8120" # TODO: endereço do periphery
enabled = true
# Stacks das aplicações do host, gerenciadas via Resource Sync.
#
# Cada stack aponta pro compose deste repo; o Komodo faz o pull e compara
# estado do container com o disco. deploy = false deixa o sync detectar
# diffs sem aplicar (útil no primeiro import), mudando pra true depois.
#
# Referência: https://docs.rs/komodo_client/latest/komodo_client/entities/stack/struct.StackConfig.html

[[stack]]
name = "n8n"
description = "Automação - imagem custom com Puppeteer + OCI CLI"
tags = ["prod"]
deploy = true # TODO: false até validar o primeiro sync
[stack.config]
server = "lab-prod-01"
git_provider = "github.com"
repo = "Brunovski3/devops-homelab"
branch = "master"
run_directory = "compose/n8n"
file_paths = ["compose.yaml"]

[[stack]]
name = "grafana"
description = "Observabilidade - dashboards e alertas"
tags = ["prod"]
deploy = false
[stack.config]
server = "lab-prod-01"
git_provider = "github.com"
repo = "Brunovski3/devops-homelab"
branch = "master"
run_directory = "compose/grafana"
file_paths = ["compose.yaml"]

[[stack]]
name = "komodo"
description = "Core + Mongo + Periphery (labels komodo.skip evitam auto-recursão)"
tags = ["prod", "komodo"]
deploy = false
[stack.config]
server = "lab-prod-01"
git_provider = "github.com"
repo = "Brunovski3/devops-homelab"
branch = "master"
run_directory = "compose/komodo"
file_paths = ["compose.yaml"]
